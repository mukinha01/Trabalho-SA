<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Veículos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <img src="imagem.png" class="logo" alt="" srcset="">
    <nav>
      <a href="#">Contato</a>
      <a href="#">Serviço</a>
      <a href="#">Sobre</a>
      <button class="login">Login</button>
    </nav>
  </header>

  <!-- TÍTULO -->
  <section class="hero">
    <h1>BS MOTORS</h1>
    <p>"Mais do que apenas veículos, são sonhos...🙌"</p>
    <a href="#" class="btn-main">Compre Agora</a>
  </section>

  <!-- CARROS -->
  <section class="produtos">
    <h2 class="carro">Carros</h2>
    <div class="grid" id="lista-carros">
      <!-- Os carros serão carregados aqui via JavaScript -->
      <p class="loading">Carregando carros...</p>
    </div>
  </section>

  <!-- MOTOS -->
  <section class="produtos">
    <h2 class="moto">Motos</h2>
    <div class="grid" id="lista-motos">
      <!-- As motos serão carregadas aqui via JavaScript -->
      <p class="loading">Carregando motos...</p>
    </div>
  </section>

  <!-- VENDEDORES -->
  <section class="vendedores">
    <h2>VENDEDORES</h2>
    <p>Nossos vendedores são especialistas apaixonados pelo que fazem...</p>
    <div class="grid" id="lista-vendedores">
      <!-- Os vendedores serão carregados aqui via JavaScript -->
      <p class="loading">Carregando vendedores...</p>
    </div>
  </section>

  <!-- Link para o arquivo JavaScript -->
  <script src="script.js"></script>

</body>
</html>
